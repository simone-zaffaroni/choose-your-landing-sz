<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OUTDIRT · EICMA 2026</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#050505" />
    <!--
      Any address that no longer exists lands on the landing page. This is what keeps the
      printed QR codes working: they point to the old presentation PDF
      (…/choose-your-landing-sz/ChooseYourLanding_SZ_Eicma.pdf), which has been replaced by the site.
    -->
    <script>
      (function () {
        // GitHub Pages project site: the landing lives under the first folder of the path
        var first = location.pathname.split('/')[1];
        var base = /\.github\.io$/.test(location.hostname) && first ? '/' + first + '/' : '/';
        location.replace(base + location.search);
      })();
    </script>
    <meta http-equiv="refresh" content="2; url=./" />
    <style>
      html {
        background: #050505;
        color: #f5f5f5;
        font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
      }
      a {
        color: #fffc0c;
      }
    </style>
  </head>
  <body>
    <p><a href="./">OUTDIRT — EICMA 2026 →</a></p>
  </body>
</html>
